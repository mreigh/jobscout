[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout"
version = "0.1.0"
description = "A personal job-search radar: watch target companies, filter hard, score honestly, attach the warm path."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matt Reigh" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
jobscout = "jobscout.cli:app"

[tool.setuptools.packages.find]
include = ["jobscout*"]

[tool.setuptools.package-data]
"jobscout.store" = ["migrations/*.sql"]
"jobscout" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # fixtures and expected values read better on one line
