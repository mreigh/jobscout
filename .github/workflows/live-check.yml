name: Live API check

# Runs ATS detection for real against the scrubbed sample watchlist, so we find out
# when Greenhouse, Lever, Ashby, SmartRecruiters, or Workable change their public APIs.
# Results show up as annotations on the run. Never touches personal data.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"   # Mondays, ~6am Central
  push:
    branches: [main]
    paths:
      - "jobscout/detect/**"
      - "jobscout/http.py"
      - "samples/live-check.csv"
      - "jobscout/collect/**"
      - ".github/workflows/live-check.yml"
      - ".github/scripts/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Canary (nonsense slug must not be found anywhere)
        run: python .github/scripts/canary.py
      - name: Detect against sample watchlist
        if: always()
        env:
          JOBSCOUT_DB_PATH: ci-data/live.db
          JOBSCOUT_LOG_DIR: ci-logs
        run: |
          jobscout init
          jobscout watchlist import --file samples/live-check.csv
          jobscout detect --refresh
      - name: Collect postings from every ATS type
        if: always()
        env:
          JOBSCOUT_DB_PATH: ci-data/live.db
          JOBSCOUT_LOG_DIR: ci-logs
        run: jobscout collect
      - name: Report results
        if: always()
        run: python .github/scripts/report_detection.py ci-data/live.db
